name: Android Wear OS build
on:
  push:
    branches: [main]
    paths: ["wear/**", "*.gradle.kts", "settings.gradle.kts", ".github/workflows/android.yml"]
  pull_request:
    branches: [main]
    paths: ["wear/**", "*.gradle.kts", "settings.gradle.kts", ".github/workflows/android.yml"]
  workflow_dispatch:
jobs:
  build-wear:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build Wear OS APK
        run: gradle :wear:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AnishOS-Wear-debug
          path: wear/build/outputs/apk/debug/*.apk
          if-no-files-found: error
