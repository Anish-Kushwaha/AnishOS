name: Android Wear OS build

on:
  push:
    branches: [main]
    paths:
      - "wear/**"
      - "*.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/android.yml"
  pull_request:
    branches: [main]
    paths:
      - "wear/**"
      - "*.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anishos-wear-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-wear:
    name: Build Wear OS APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android platform and build tools
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"

      - name: Build Wear OS APK
        run: gradle --no-daemon :wear:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: AnishOS-Wear-debug
          path: wear/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
