name: AnishOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anishos-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-quality:
    name: TypeScript and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check and build production app
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
        run: npm run check

      - name: Ensure the build leaves TypeScript configuration unchanged
        run: git diff --exit-code -- tsconfig.json
